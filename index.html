<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A minimal productivity dashboard built with HTML, CSS and JavaScript.">
    <title>Focus Dashboard</title>

    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23080808'/%3E%3Ccircle cx='50' cy='50' r='32' fill='none' stroke='%23ffffff' stroke-width='5'/%3E%3Ccircle cx='50' cy='50' r='4' fill='%23ffffff'/%3E%3Cpath d='M50 50 L50 29 M50 50 L68 61' fill='none' stroke='%23ffffff' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M27 27 L34 20 M73 27 L66 20' fill='none' stroke='%23666666' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <a class="logo" href="/">Focus<span>.</span></a>
        <button class="theme-toggle" id="themeBtn" type="button" aria-label="Switch theme">☀️</button>
    </header>

    <main class="container">
        <section class="hero">
            <p class="date" id="date"></p>

            <div class="clock-wrap">
                <div class="clock-orbit clock-orbit--one"></div>
                <div class="clock-orbit clock-orbit--two"></div>
                <span class="clock-dot"></span>
                <h1 class="clock" id="clock">00:00:00</h1>
            </div>

            <p class="greeting" id="greeting">Good evening.</p>
        </section>

        <section class="dashboard">
            <article class="card todo-card">
                <div class="card-header">
                    <div>
                        <span class="eyebrow">TASKS</span>
                        <h2>Today's Tasks</h2>
                    </div>
                    <span class="progress-value" id="progressText">0%</span>
                </div>

                <div class="progress">
                    <div class="progress-bar" id="progressBar"></div>
                </div>

                <div class="task-form">
                    <input id="taskInput" type="text" placeholder="Add a new task..." maxlength="120"
                        autocomplete="off">
                    <button id="addBtn" type="button" aria-label="Add task">+</button>
                </div>

                <div class="task-list" id="taskList"></div>
            </article>

            <article class="card quote-card">
                <div>
                    <span class="eyebrow">DAILY QUOTE</span>

                    <blockquote class="quote">
                        <span class="quote-mark">“</span>
                        <p id="quote">Stay focused and keep going.</p>
                        <span class="quote-mark">”</span>
                    </blockquote>
                </div>

                <button class="quote-button" id="quoteBtn" type="button">New quote</button>
            </article>
        </section>
    </main>

    <footer class="footer">
        <span>© 2026</span>
        <a href="https://github.com/nazhuldev" target="_blank" rel="noopener noreferrer">Kyu Dev</a>
    </footer>

    <script src="script.js"></script>
</body>

</html>
